version: "3.8"

services:
  auth:
    build: ./services/auth
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
  users:
    build: ./services/users
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - USERS_DATABASE_URL=mysql+aiomysql://dbuser:secret@mysql:3306/user_db
    depends_on:
      - mysql
  nutrition:
    build: ./services/nutrition
    ports:
      - "8003:8003"
    environment:
      - PYTHONUNBUFFERED=1
  payment:
    build: ./services/payment
    ports:
      - "8004:8004"
    environment:
      - PYTHONUNBUFFERED=1
  workout:
    build: ./services/workout
    ports:
      - "8005:8005"
    environment:
      - PYTHONUNBUFFERED=1
  calories:
    build: ./services/calories
    ports:
      - "8006:8006"
    environment:
      - PYTHONUNBUFFERED=1
  coaching:
    build: ./services/coaching
    ports:
      - "8007:8007"
    environment:
      - PYTHONUNBUFFERED=1

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: user_db
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql-data:

# Optional: add networks later
